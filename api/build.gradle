import com.github.jengelman.gradle.plugins.shadow.transformers.ServiceFileTransformer
import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'maven-publish'
    id 'signing'
}

ext {
    helidonVersion = '2.6.9'
    jdbi3Version = '3.40.0'
    metricsVersion = '4.2.25'
    prometheusVersion = '0.16.0'
    testcontainersVersion = '1.18.3'
    sentryVersion = '6.34.0'
}

dependencies {
    implementation project(':clients:java')
    // The serving layer: Helidon SE's web server, and the standard annotations and interfaces the
    // resources are written against. Helidon SE brings no JAX-RS runtime; marquez.http is it.
    implementation "io.helidon.webserver:helidon-webserver:${helidonVersion}"
    implementation "io.helidon.common:helidon-common-http:${helidonVersion}"
    implementation "io.helidon.common:helidon-common-reactive:${helidonVersion}"
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:2.1.6'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    implementation 'org.glassfish:jakarta.el:3.0.4'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'net.sourceforge.argparse4j:argparse4j:0.9.0'
    implementation 'com.zaxxer:HikariCP:5.0.1'
    // The project's own JSON settings, which the entities keep, and the metric registries the
    // service writes to and the admin and Prometheus endpoints read.
    implementation "io.dropwizard:dropwizard-jackson:${dropwizardVersion}"
    implementation "io.dropwizard.metrics:metrics-core:${metricsVersion}"
    implementation "io.dropwizard.metrics:metrics-annotation:${metricsVersion}"
    implementation "io.dropwizard.metrics:metrics-healthchecks:${metricsVersion}"
    implementation "io.dropwizard.metrics:metrics-jdbi3:${metricsVersion}"
    implementation "io.dropwizard.metrics:metrics-json:${metricsVersion}"
    implementation "io.dropwizard.metrics:metrics-jvm:${metricsVersion}"
    implementation 'ch.qos.logback:logback-classic:1.2.13'
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "io.prometheus:simpleclient:${prometheusVersion}"
    implementation "io.prometheus:simpleclient_common:${prometheusVersion}"
    implementation "io.prometheus:simpleclient_dropwizard:${prometheusVersion}"
    implementation "io.prometheus:simpleclient_hotspot:${prometheusVersion}"
    implementation "io.openlineage:openlineage-java:${openlineageVersion}"
    implementation "org.jdbi:jdbi3-core:${jdbi3Version}"
    implementation "org.jdbi:jdbi3-jackson2:${jdbi3Version}"
    implementation "org.jdbi:jdbi3-postgres:${jdbi3Version}"
    implementation "org.jdbi:jdbi3-sqlobject:${jdbi3Version}"
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation "io.sentry:sentry:${sentryVersion}"
    implementation 'org.flywaydb:flyway-core:8.5.13'
    implementation "org.postgresql:postgresql:${postgresqlVersion}"
    implementation 'com.graphql-java:graphql-java:20.9'

    implementation 'org.opensearch.client:opensearch-rest-client:2.19.1'
    implementation 'org.opensearch.client:opensearch-java:2.22.0'

    testImplementation "org.jdbi:jdbi3-testing:${jdbi3Version}"
    testImplementation "org.jdbi:jdbi3-testcontainers:${jdbi3Version}"
    testImplementation "org.junit.vintage:junit-vintage-engine:${junit5Version}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation 'org.apache.httpcomponents:httpclient:4.5.14'
}

task testUnit(type: Test) {
    useJUnitPlatform {
        includeTags 'UnitTests'
    }
}

task testIntegration(type: Test) {
    useJUnitPlatform {
        includeTags 'IntegrationTests'
    }
}

task testDataAccess(type: Test) {
    useJUnitPlatform {
        includeTags 'DataAccessTests'
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'io.github.marquezproject'
            artifactId = 'marquez-api'

            from components.java

            artifact sourceJar
            artifact javadocJar

            pom {
                name = 'marquez-api'
                description = 'Collect, aggregate, and visualize a data ecosystem\'s metadata'
                url = 'https://github.com/MarquezProject/marquez'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'marquezproject'
                        name = 'Marquez Project'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/MarquezProject/marquez.git'
                    developerConnection = 'scm:git:ssh://github.com:MarquezProject/marquez.git'
                    url = 'https://github.com/MarquezProject/marquez'
                }
            }
        }
    }

    processResources {
        filter ReplaceTokens, tokens: [
                "version": project.property("version")
        ]
    }

    repositories {
        maven {
            def releasesRepoUrl = 'https://oss.sonatype.org/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://oss.sonatype.org/content/repositories/snapshots/'
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username = System.getenv('OSSRH_USERNAME')
                password = System.getenv('OSSRH_PASSWORD')
            }
        }
    }
}

signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

application {
    // The entry point of the one runnable jar: `java -jar marquez-api.jar server marquez.yml`,
    // the configuration file named on the command line as it always was. io.dropwizard.Application
    // used to provide this entry point and parse that command line; marquez.MarquezApp does both
    // now, and this is what names it.
    mainClass = 'marquez.MarquezApp'
}

shadowJar {
    // One jar with this project's classes and every dependency in it, published under the plain
    // name, which is the artefact the service is run from.
    archiveClassifier.set('')
    // The serving layer reaches its javax.ws.rs.ext.RuntimeDelegate through META-INF/services, so
    // the service files of this project and of its dependencies have to survive the merge into
    // that one jar.
    transform(ServiceFileTransformer)
    // Add LICENSE to Jar
    from(projectDir) {
        include 'LICENSE'
    }
    manifest {
        attributes(
                'Created-By': "Gradle ${gradle.gradleVersion}",
                'Built-By': System.getProperty('user.name'),
                'Build-Jdk': System.getProperty('java.version'),
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                // What `java -jar` runs: the entry point declared above.
                'Main-Class': application.mainClass)
    }
}

runShadow {
    // The same jar, run from the build: the server command, and the configuration file beside it.
    args = ['server', '../marquez.yml']
}

tasks.distZip.dependsOn tasks.shadowJar
tasks.distTar.dependsOn tasks.shadowJar
tasks.startScripts.dependsOn tasks.shadowJar
tasks.shadowJar.dependsOn tasks.jar
